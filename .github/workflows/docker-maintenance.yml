# =============================================================================
# Docker Maintenance - Dependabot PRs (automatic merging off)
# =============================================================================
# Hands every Dependabot PR to the reusable docker-maintenance-dependabot
# workflow, which annotates its decision on the PR. It approves, merges and
# releases nothing here: required-workflows is not set (see below), because
# no pull_request workflow builds or tests the updates - release.yml runs
# only on push to main and on workflow_dispatch.
#
# Every Dependabot PR (docker and pip in src/cleanup-manager, GitHub
# Actions) therefore stays open with a notice until it is reviewed and
# merged by hand. That manual merge is an ordinary push to main, so
# release.yml then releases a fix(cleanup-manager) update.
# =============================================================================

name: 🔧 Docker Maintenance

on:
  # No paths filter: every Dependabot PR, whatever its ecosystem, reaches the
  # module and gets an explicit decision and annotation instead of silently
  # staying open. Without required-workflows (below) the module merges
  # nothing and leaves each PR open with a notice; GitHub Actions updates and
  # other .github/ changes always stay open for a manual merge. PRs not
  # opened by Dependabot skip the job.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      merge-method: 'squash'
      auto-approve: true
      # required-workflows is deliberately not set, so nothing is merged
      # automatically: the repository has no pull_request CI (release.yml
      # runs only on push and workflow_dispatch), so an update would be
      # merged untested. Set it once a PR workflow builds and tests changes.
    secrets: inherit
